<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup - SEO Audit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="muted">Start auditing websites in minutes.</p>
        <label>
          Email
          <input class="input" type="email" placeholder="you@example.com" />
        </label>
        <label>
          Password
          <input class="input" type="password" placeholder="Create a password" />
        </label>
        <label>
          Confirm password
          <input class="input" type="password" placeholder="Repeat password" />
        </label>
        <button class="button primary">Create account</button>
        <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </body>
</html>
