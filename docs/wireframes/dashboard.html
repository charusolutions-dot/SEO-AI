<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SEO Audit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h2>SEO Audit</h2>
        <nav class="nav">
          <a class="active" href="dashboard.html">Dashboard</a>
          <a href="project.html">Projects</a>
          <a href="#">Settings</a>
        </nav>
      </aside>
      <div class="content">
        <header class="topbar">
          <div>
            <strong>Dashboard</strong>
            <div class="muted">Overview of your projects</div>
          </div>
          <div class="badge">User • Logout</div>
        </header>
        <main class="page">
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <h3>Your projects</h3>
                <div class="muted">Create a project to start an audit.</div>
              </div>
              <a class="button primary" href="add-project.html">Add Project</a>
            </div>
          </div>

          <div class="card">
            <table class="table">
              <thead>
                <tr>
                  <th>Project</th>
                  <th>Website</th>
                  <th>Last scan</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Acme Marketing</td>
                  <td>https://acme.com</td>
                  <td>—</td>
                  <td><span class="badge">No scans yet</span></td>
                </tr>
                <tr>
                  <td>Studio One</td>
                  <td>https://studio.one</td>
                  <td>—</td>
                  <td><span class="badge">No scans yet</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
